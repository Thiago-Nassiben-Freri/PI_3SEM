spring.application.name=petvax

spring.datasource.url=jdbc:postgresql://ep-cool-thunder-b4m3pk96-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner

spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# Notificações (RF01): geração automática diária dos lembretes pendentes.
# Deixe false nas máquinas de desenvolvimento (o banco é compartilhado); ligue só na produção.
petvax.notificacoes.geracao-automatica=false
#petvax.notificacoes.cron=0 0 8 * * *

