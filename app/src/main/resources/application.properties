spring.application.name=petvax

spring.datasource.url=jdbc:postgresql://ep-cool-thunder-b4m3pk96-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner

spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# Primeiro administrador: criado ao iniciar, só se o banco ainda não tiver nenhum admin.
# Defina as variáveis de ambiente PETVAX_ADMIN_LOGIN e PETVAX_ADMIN_SENHA (nunca coloque a senha aqui)
petvax.admin.login=${PETVAX_ADMIN_LOGIN:}
petvax.admin.senha=${PETVAX_ADMIN_SENHA:}

# Notificações (RF01): geração automática diária dos lembretes pendentes.
# Deixe false nas máquinas de desenvolvimento (o banco é compartilhado); ligue só na produção.
petvax.notificacoes.geracao-automatica=false
#petvax.notificacoes.cron=0 0 8 * * *

# E-mail (RF08, opcional): o canal EMAIL só é ativado se spring.mail.host estiver definido
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=${MAIL_USERNAME}
#spring.mail.password=${MAIL_PASSWORD}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# WhatsApp (RF01): "link" = gera link wa.me e o veterinário confirma o envio (padrão, sem configuração);
# "api" = envio automático pela WhatsApp Cloud API da Meta (precisa das variáveis abaixo)
petvax.whatsapp.modo=${WHATSAPP_MODO:link}
petvax.whatsapp.token=${WHATSAPP_TOKEN:}
petvax.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
# Nome do modelo aprovado na Meta, com uma variável {{1}} para o texto. Vazio = envia texto livre
petvax.whatsapp.template=${WHATSAPP_TEMPLATE:}
petvax.whatsapp.template-idioma=pt_BR
petvax.whatsapp.api-versao=v23.0